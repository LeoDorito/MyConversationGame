<style>

.screen{display:none}.screen.on{display:block}
#logo{width:min(70vw,288px);height:auto;margin-top:20px}
h1{margin:14px 0 10px;font-size:1.6rem;color:var(--green);text-shadow:4px 4px 0 var(--line);line-height:1.3}
p.sub{color:var(--muted);margin:0 0 28px;font-size:.75rem}
#play{background:none;border:0;padding:0;display:inline-block}
#play img{width:min(60vw,256px);height:auto;transition:transform .1s steps(2)}
#play:hover img{transform:scale(1.0625)}
#play:active img{transform:scale(.9375)}
.hint{color:var(--muted);margin-top:14px;font-size:.65rem}
.top{display:flex;align-items:center;gap:14px;margin-bottom:28px}
.bar{flex:1;height:24px;border:4px solid var(--line);background:var(--card);padding:2px}
#fill{height:100%;width:0;background:repeating-linear-gradient(90deg,var(--green) 0 12px,var(--gd) 12px 16px);transition:width .3s steps(6)}
#hearts{display:flex;gap:4px}
.hrt{width:24px;height:20px;image-rendering:pixelated}
h2{font-size:.95rem;margin:10px 0 24px;text-align:left;line-height:1.6}
.opt{display:block;width:100%;text-align:left;margin-bottom:14px;padding:14px 16px;font:inherit;font-size:.75rem;line-height:1.6;color:var(--text);background:var(--card);border:4px solid var(--line);box-shadow:0 6px 0 var(--line)}
.opt:hover{background:#bfe9ff;color:#2b2b3a;border-color:var(--blue);box-shadow:0 6px 0 var(--blue)}
.opt:active{transform:translateY(4px);box-shadow:0 2px 0 var(--line)}
.opt.ok{background:#c9f29a;color:#2b2b3a;border-color:var(--gd);box-shadow:0 6px 0 var(--gd)}
.opt.no{background:#ffc4c4;color:#2b2b3a;border-color:var(--rd);box-shadow:0 6px 0 var(--rd)}
.opt:disabled{pointer-events:none}
#fb{white-space:pre-line;min-height:80px;margin-top:18px;font-size:.7rem;text-align:left;line-height:1.8}
.big{display:inline-block;margin-top:10px;padding:16px 28px;border:4px solid var(--line);background:var(--green);box-shadow:0 6px 0 var(--gd),0 6px 0 4px var(--line);color:#fff;text-shadow:2px 2px 0 var(--gd);font:inherit;font-size:.8rem;text-transform:uppercase}
.big:active{transform:translateY(5px);box-shadow:0 1px 0 var(--gd),0 1px 0 4px var(--line)}
#xp{font-size:2rem;color:#ffb100;text-shadow:4px 4px 0 var(--line);margin:18px 0}
.sm{width:128px;height:128px}
.pathtop{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px;font-size:.7rem}
.sbtn{font:inherit;font-size:.65rem;padding:10px 12px;background:var(--card);color:var(--text);border:4px solid var(--line);box-shadow:0 4px 0 var(--line)}
.sbtn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.banner{background:var(--green);color:#fff;border:4px solid var(--line);box-shadow:0 6px 0 var(--gd),0 6px 0 4px var(--line);padding:14px;text-align:left;margin-bottom:22px;font-size:.65rem;text-shadow:2px 2px 0 var(--gd)}
.banner b{display:block;font-size:.95rem;margin-top:6px}
.step{display:flex;flex-direction:column;align-items:center;margin-bottom:30px}
.node{position:relative;width:96px;height:96px;padding:0;background:none;border:0}
.node .sp{width:96px;height:96px;display:block}
.node .ic{position:absolute;left:50%;top:50%;width:35px;height:35px;transform:translate(-50%,-50%)}
.node.lock .sp{filter:grayscale(1) brightness(.75)}
.nm{font-size:.6rem;margin-top:8px;color:var(--muted)}
.go{font-size:.65rem;background:var(--card);border:4px solid var(--line);padding:6px 10px;margin-bottom:10px;animation:bob .8s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
#msg{min-height:20px;font-size:.6rem;line-height:1.6;margin-bottom:16px}
.top .sbtn{padding:8px 10px}
.pic{width:160px;height:160px;image-rendering:pixelated;background:var(--card);border:4px solid var(--line);box-shadow:0 6px 0 var(--line);display:block;margin:0 auto 22px}
.banner{margin:30px 0 26px}
.banner span{display:block;margin-top:8px;font-size:.55rem;line-height:1.5}
#q{white-space:pre-line}
.tl{font-size:.6rem;color:var(--blue);margin:-12px 0 18px;text-align:left}
.tbox{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 60px);max-width:536px;margin:0 auto;z-index:20;background:var(--card);border:4px solid var(--line);box-shadow:0 6px 0 var(--line);padding:16px;text-align:left;font-size:.65rem;line-height:1.8}
.tbox .big{margin:0 10px 0 0;padding:12px 16px;font-size:.65rem}
</style></head>

function pic(k){return IMG[k]}
function shuf(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function mk(text,right,wrong,exp,pk){var o=shuf([right].concat(wrong));return [text,o,o.indexOf(right),exp,pk]}
var CH=[["tung","Tung Tung Tung Sahur","A wooden log with a baseball bat"],["trala","Tralalero Tralala","A blue shark wearing sneakers"],["bomb","Bombardiro Crocodilo","Half crocodile, half bomber plane"],["ballerina","Ballerina Cappuccina","A ballerina with a cappuccino cup for a head"],["chimp","Chimpanzini Bananini","A chimpanzee with a banana body"],["lirili","Lirilì Larilà","An elephant with a cactus body and sandals"]];
function f1(x){return x[1]}function f2(x){return x[2]}
function gen(n,mode,base){
  base=base||CH;var out=[],bag=[];
  while(out.length<n){
    if(!bag.length)bag=shuf(base);
    var c=bag.pop(),oth=shuf(base.filter(function(x){return x!==c})).slice(0,2);
    var t=mode==="pic"?0:mode==="desc"?1+Math.floor(Math.random()*2):Math.floor(Math.random()*3);
    var ex=c[1]+": "+c[2]+".";
    if(t===0)out.push(mk("Who is this?",c[1],oth.map(f1),ex,c[0]));
    else if(t===1)out.push(mk("Which character is this?\n"+c[2],c[1],oth.map(f1),ex));
    else out.push(mk("What is "+c[1]+"?",c[2],oth.map(f2),ex));
  }

}
function clesson(idx){return function(){var cs=idx.map(function(i){return CH[i]});

function t2m(w,P){var wr=shuf(P.filter(function(x){return x!==w})).slice(0,2);return mk("What does “"+w[0]+"” mean?",w[1],wr.map(f2b),"“"+w[0]+"” means: "+w[1]+".")}
function m2t(w,P){var wr=shuf(P.filter(function(x){return x!==w})).slice(0,2);return mk("Which word means:\n"+w[1]+"?",w[0],wr.map(function(x){return x[0]}),"That’s “"+w[0]+"”.")}
